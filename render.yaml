services:
  - type: web
    name: doctorsearch-app
    env: node
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ELASTICSEARCH_URL
        value: ${ELASTICSEARCH_URL}
      - key: GROQ_API_KEY
        sync: false
    healthCheckPath: /

